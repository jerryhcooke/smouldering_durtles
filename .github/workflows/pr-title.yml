name: PR title check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Renovate tags its PRs with the `dependencies` label (see renovate.json);
          # its titles ("Update dependency ...") aren't conventional-commit prefixed,
          # so skip validation for them.
          ignoreLabels: |
            dependencies
