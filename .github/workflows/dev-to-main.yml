name: Promote dev to main

# Manual promotion of the dev branch to main (releases are cut from main).
# dev is the default integration branch, so main is normally a subset of dev;
# the rebase is a no-op in that case and just makes main track the latest dev.
on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional note (no effect on the run)
        required: false

permissions:
  contents: write

jobs:
  promote:
    name: Rebase dev onto main and update main
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Rebase dev onto main and update main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:main
