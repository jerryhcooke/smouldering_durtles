apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    defaultConfig {
        applicationId "com.lazy_durtles.wk"
        minSdkVersion 21
        targetSdkVersion 36
        compileSdk = 36
        versionCode ((System.getenv("VERSION_CODE") ?: "90") as Integer)
        versionName (System.getenv("VERSION_NAME") ?: "1.3.0")
        multiDexEnabled true

        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testApplicationId "com.lazy_durtles.wk.test"
        testHandleProfiling true
        testFunctionalTest true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    buildFeatures {
        compose true
        buildConfig true
        resValues true
    }
    signingConfigs {
        release {
            // Reads keystore.properties (gitignored) when present; CI overrides via
            // KEYSTORE_* env vars. Without either, release builds fall back to the debug key.
            def keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props.getProperty("storeFile"))
                storePassword props.getProperty("storePassword")
                keyAlias props.getProperty("keyAlias")
                keyPassword props.getProperty("keyPassword")
            } else if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile rootProject.file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            resValue 'string', 'fileprovider_authority', 'com.lazy_durtles.wk.fileprovider'
            resValue 'string', 'searchprovider_authority', 'com.lazy_durtles.wk.db.SubjectContentProvider'
            resValue 'string', 'applabel', '@string/label'
            buildConfigField 'String', 'FILEPROVIDER_AUTHORITY', '"com.lazy_durtles.wk.fileprovider"'
            if (System.getenv("KEYSTORE_FILE") != null || rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix '.debug'
            resValue 'string', 'fileprovider_authority', 'com.lazy_durtles.wk.debug.fileprovider'
            resValue 'string', 'searchprovider_authority', 'com.lazy_durtles.wk.debug.db.SubjectContentProvider'
            resValue 'string', 'applabel', '@string/labelDebug'
            buildConfigField 'String', 'FILEPROVIDER_AUTHORITY', '"com.lazy_durtles.wk.debug.fileprovider"'
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    testOptions {
        reportDir "$rootDir/test-reports"
        resultsDir "$rootDir/test-results"
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    lint {
        // Adopt lint gradually: recorded pre-existing issues are in the baseline,
        // new errors fail the build. Regenerate with: ./gradlew :app:updateLintBaseline
        baseline = file("lint-baseline.xml")
    }
    namespace 'com.lazy_durtles.wk'
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    defaultConfig {
        vectorDrawables.generatedDensities = []
    }


}

dependencies {
    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation "androidx.compose.material3:material3:1.2.0"
    implementation "androidx.compose.material:material:1.6.0"
    implementation "androidx.compose.ui:ui:1.6.0"
    implementation "io.coil-kt:coil-compose:2.5.0"
    implementation "io.coil-kt:coil-svg:2.5.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.0"
    implementation "androidx.compose.foundation:foundation:1.6.0"
    implementation "androidx.compose.runtime:runtime:1.6.0"
    implementation "androidx.compose.runtime:runtime-livedata:1.6.0"
    implementation "androidx.compose.animation:animation:1.6.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    debugImplementation "androidx.compose.ui:ui-tooling:1.6.0"

    implementation 'junit:junit:4.13.2'
    implementation 'androidx.activity:activity-ktx:1.6.0'
    implementation 'androidx.fragment:fragment-ktx:1.3.6'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    debugImplementation 'androidx.annotation:annotation:1.7.1'

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.0'
    implementation 'androidx.legacy:legacy-support-core-utils:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.6'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:5.0.0-alpha.6'
    implementation 'com.github.madrapps:pikolo:2.0.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.annotation:annotation:1.7.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:unchecked'
    options.deprecation = true
}